[project]
name = "personas"
version = "0.1.0"
description = "AI models and RAGs for historical figures"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "numpy>=2",
    "requests>=2.32",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
train = [
    "torch>=2.8",
    "unsloth>=2025.10",
    "trl>=0.21",
    "peft>=0.17",
    "transformers>=4.56",
    "bitsandbytes>=0.47",
    "datasets>=3",
    "accelerate>=1.10",
    "gguf>=0.17",
    "sentencepiece",
    "protobuf",
]

[tool.uv]
package = false
